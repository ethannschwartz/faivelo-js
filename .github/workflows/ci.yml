# Goes to .github/workflows/ci.yml in the public faivelo-js repo.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  nuxt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-nuxt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm pack
